
<div class="min-h-screen bg-[#f0f2f5] dark:bg-[#0d1017] flex items-center justify-center px-4 py-10 transition-colors duration-300">

  <div class="w-full max-w-2xl text-center">

    <!-- Illustration -->
    <div class="relative mx-auto mb-8 flex h-52 w-52 items-center justify-center">

      <div class="absolute inset-0 rounded-full bg-violet-200/50 blur-3xl dark:bg-violet-600/10"></div>

      <div class="relative flex h-44 w-44 items-center justify-center rounded-[2.5rem] border border-violet-200 bg-white shadow-xl shadow-violet-200/30 dark:border-violet-500/20 dark:bg-[#181d27] dark:shadow-black/20">

        <i class="fa-solid fa-compass text-7xl text-violet-500"></i>

        <span class="absolute -right-3 -top-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-600 text-xl font-black text-white shadow-lg shadow-violet-500/30">
          ?
        </span>

      </div>

    </div>

    <!-- 404 -->
    <h1 class="text-8xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-violet-600 via-purple-500 to-fuchsia-500 sm:text-9xl">
      404
    </h1>

    <!-- Text -->
    <h2 class="mt-5 text-2xl font-extrabold text-gray-900 dark:text-white sm:text-3xl">
      Oops! Page Not Found
    </h2>

    <p class="mx-auto mt-4 max-w-md text-sm leading-7 text-gray-500 dark:text-gray-400 sm:text-base">
      Looks like you've wandered into uncharted territory.
      The page you're looking for doesn't exist or may have been moved.
    </p>

    <!-- Buttons -->
    <div class="mt-9 flex flex-col items-center justify-center gap-3 sm:flex-row">

      <button
        type="button"
        routerLink="/home"
        class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 px-7 py-3.5 font-bold text-white shadow-lg shadow-violet-500/25 transition duration-300 hover:-translate-y-1 hover:shadow-violet-500/40 sm:w-auto"
      >
        <i class="fa-solid fa-house"></i>
        Back to Home
      </button>

      <button
        type="button"
        (click)="goBack()"
        class="flex w-full items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white px-7 py-3.5 font-bold text-gray-700 transition duration-300 hover:-translate-y-1 hover:border-violet-300 hover:text-violet-600 dark:border-gray-700 dark:bg-[#181d27] dark:text-gray-200 dark:hover:border-violet-500 dark:hover:text-violet-400 sm:w-auto"
      >
        <i class="fa-solid fa-arrow-left"></i>
        Go Back
      </button>

    </div>

    <!-- Footer -->
    <div class="mt-14">
      <p class="text-sm font-bold tracking-wide text-gray-400 dark:text-gray-600">
        SOCIAL<span class="text-violet-500">LY</span>
      </p>
      <p class="mt-2 text-xs text-gray-400 dark:text-gray-600">
        Connecting people, one moment at a time.
      </p>
    </div>

  </div>
</div>
