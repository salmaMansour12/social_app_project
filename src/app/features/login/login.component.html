

<!-- FORGOT PASSWORD MODAL -->
@if (showForgotMessage) {

  <div
    class="fixed inset-0 z-[99999] flex items-center justify-center bg-slate-950/60 px-4 backdrop-blur-sm"
    (click)="closeForgotPasswordMessage()"
  >

    <div
      class="w-full max-w-md rounded-3xl border border-violet-100 bg-white p-7 shadow-2xl"
      (click)="$event.stopPropagation()"
    >

      <!-- Icon -->
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-violet-100 text-violet-600">
        <i class="fa-solid fa-lock text-2xl"></i>
      </div>

      <!-- Title -->
      <h3 class="mb-3 text-center text-2xl font-extrabold text-slate-900">
        Password Change
      </h3>

      <!-- Description -->
      <p class="mb-6 text-center text-sm leading-7 text-slate-500">
        Forgot your password? Password recovery is currently unavailable.
        You can change your password after logging in from
        <span class="font-bold text-violet-600">Settings → Security.</span>
      </p>

      <!-- Close Button -->
      <button
        type="button"
        (click)="closeForgotPasswordMessage()"
        class="w-full rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-500 py-3 font-bold text-white shadow-lg shadow-violet-200 transition hover:-translate-y-0.5 hover:shadow-xl"
      >
        Got it
      </button>

    </div>
  </div>

}
