<section class="w-full rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">

  <!-- Header -->
  <div class="mb-5 flex items-center justify-between">
    <h3 class="text-lg font-bold text-gray-900">
      Comments <span class="text-purple-600">(3)</span>
    </h3>

    <button class="flex items-center gap-2 text-sm text-gray-500 transition hover:text-purple-700">
      <i class="fa-solid fa-arrow-down-wide-short"></i>
      Most relevant
    </button>
  </div>

  <!-- Add Comment -->
  <div class="mb-6 flex items-start gap-3">
    <img
      src="https://i.pravatar.cc/100?img=47"
      alt="Your profile"
      class="h-10 w-10 rounded-full object-cover"
    />

    <div class="flex-1">
      <div class="flex items-center gap-2 rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 transition focus-within:border-purple-500 focus-within:bg-white">
        <input
          type="text"
          placeholder="Write a comment..."
          class="w-full bg-transparent text-sm text-gray-800 outline-none placeholder:text-gray-400"
        />

        <button class="text-purple-600 transition hover:text-purple-800">
          <i class="fa-regular fa-face-smile text-lg"></i>
        </button>

        <button class="text-purple-600 transition hover:text-purple-800">
          <i class="fa-solid fa-image text-lg"></i>
        </button>
      </div>

      <div class="mt-2 flex justify-end">
        <button
          class="rounded-xl bg-purple-600 px-5 py-2 text-sm font-semibold text-white transition hover:bg-purple-700">
          Comment
        </button>
      </div>
    </div>
  </div>

  <!-- Comment 1 -->
  <div class="mb-5 flex items-start gap-3">
    <img
      src="https://i.pravatar.cc/100?img=12"
      alt="Ahmed"
      class="h-10 w-10 rounded-full object-cover"
    />

    <div class="min-w-0 flex-1">
      <div class="rounded-2xl bg-gray-50 px-4 py-3">
        <div class="mb-1 flex flex-wrap items-center gap-2">
          <h4 class="text-sm font-bold text-gray-900">Ahmed Mohamed</h4>
          <span class="text-xs text-gray-400">2 hours ago</span>
        </div>

        <p class="text-sm leading-6 text-gray-700">
          This is amazing! Love the design and the colors. 💜
        </p>
      </div>

      <div class="mt-2 flex items-center gap-5 px-3 text-xs font-semibold text-gray-500">
        <button class="transition hover:text-purple-600">
          <i class="fa-regular fa-heart mr-1"></i> Like
        </button>
        <button class="transition hover:text-purple-600">Reply</button>
        <span>12 likes</span>
      </div>
    </div>
  </div>

  <!-- Comment 2 -->
  <div class="mb-5 flex items-start gap-3">
    <img
      src="https://i.pravatar.cc/100?img=44"
      alt="Mariam"
      class="h-10 w-10 rounded-full object-cover"
    />

    <div class="min-w-0 flex-1">
      <div class="rounded-2xl bg-gray-50 px-4 py-3">
        <div class="mb-1 flex flex-wrap items-center gap-2">
          <h4 class="text-sm font-bold text-gray-900">Mariam Ali</h4>
          <span class="text-xs text-gray-400">5 hours ago</span>
        </div>

        <p class="text-sm leading-6 text-gray-700">
          Keep sharing more posts like this! ✨
        </p>
      </div>

      <div class="mt-2 flex items-center gap-5 px-3 text-xs font-semibold text-gray-500">
        <button class="transition hover:text-purple-600">
          <i class="fa-regular fa-heart mr-1"></i> Like
        </button>
        <button class="transition hover:text-purple-600">Reply</button>
        <span>4 likes</span>
      </div>
    </div>
  </div>

  <!-- Comment 3 -->
  <div class="flex items-start gap-3">
    <img
      src="https://i.pravatar.cc/100?img=33"
      alt="Omar"
      class="h-10 w-10 rounded-full object-cover"
    />

    <div class="min-w-0 flex-1">
      <div class="rounded-2xl bg-gray-50 px-4 py-3">
        <div class="mb-1 flex flex-wrap items-center gap-2">
          <h4 class="text-sm font-bold text-gray-900">Omar Hassan</h4>
          <span class="text-xs text-gray-400">1 day ago</span>
        </div>

        <p class="text-sm leading-6 text-gray-700">
          The content is really helpful. Great work! 👏
        </p>
      </div>

      <div class="mt-2 flex items-center gap-5 px-3 text-xs font-semibold text-gray-500">
        <button class="transition hover:text-purple-600">
          <i class="fa-regular fa-heart mr-1"></i> Like
        </button>
        <button class="transition hover:text-purple-600">Reply</button>
        <span>8 likes</span>
      </div>
    </div>
  </div>

  <!-- View More -->
  <button class="mt-5 w-full rounded-xl py-3 text-sm font-semibold text-purple-600 transition hover:bg-purple-50">
    View more comments
  </button>

</section>
