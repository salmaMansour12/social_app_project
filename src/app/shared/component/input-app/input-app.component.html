<div class="w-full">
  <label
    [for]="name"
    class="mb-2 block text-sm font-medium text-gray-700"
  >
    {{ label }}
  </label>

  @if (control; as ctrl) {
    <div class="relative">
      <input
        [id]="name"
        [name]="name"
        [type]="inputType"
        [placeholder]="placeholder"
        [formControl]="$any(ctrl)"
        [class.border-red-500]="ctrl.invalid && (ctrl.touched || ctrl.dirty)"
        [class.border-green-500]="ctrl.valid && (ctrl.touched || ctrl.dirty)"
        class="w-full rounded-xl border bg-white px-4 py-3 pr-11 text-sm text-gray-700 outline-none transition focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
      />

      @if (type === 'password') {
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-purple-600"
          [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
        >
          <i
            class="fa-solid"
            [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'"
          ></i>
        </button>
      }
    </div>
<app-erro-message
 [control]="ctrl"
      [label]="label"></app-erro-message>
  }
</div>
