<div class="loading-screen">
  <!-- Background decorations -->
  <div class="bg-blob blob-one"></div>
  <div class="bg-blob blob-two"></div>
  <div class="ambient-glow"></div>

  <main class="loading-content">

    <!-- Animated Portal -->
    <div class="portal-scene">

      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="orbit orbit-three"></div>

      <!-- Glowing central portal -->
      <div class="portal">
        <div class="portal-ring ring-outer"></div>
        <div class="portal-ring ring-inner"></div>
        <div class="portal-core"></div>
        <div class="portal-shine"></div>
      </div>

      <!-- Orbiting paper airplane -->
      <div class="orbiting-plane">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M8 45 L91 9 L65 91 L47 59 Z"
                fill="#8B5CF6"/>
          <path d="M8 45 L91 9 L47 59 Z"
                fill="#C4B5FD"/>
          <path d="M47 59 L65 91 L70 39 Z"
                fill="#6D28D9"/>
          <path d="M47 59 L91 9"
                stroke="#EDE9FE"
                stroke-width="2"
                stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Floating chat bubbles -->
      <div class="social-icon chat-icon">
        <span></span><span></span><span></span>
      </div>

      <div class="social-icon heart-icon">♥</div>

      <div class="social-icon user-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4"
                  stroke="currentColor" stroke-width="2"/>
          <path d="M4 21 C4 16 8 14 12 14
                   C16 14 20 16 20 21"
                stroke="currentColor" stroke-width="2"
                stroke-linecap="round"/>
        </svg>
      </div>

      <div class="social-icon message-icon">•••</div>
      <div class="social-icon sparkle sparkle-one">✦</div>
      <div class="social-icon sparkle sparkle-two">✧</div>

      <span class="particle particle-one"></span>
      <span class="particle particle-two"></span>
      <span class="particle particle-three"></span>
      <span class="particle particle-four"></span>
      <span class="particle particle-five"></span>
    </div>

    <!-- Loading text -->
    <section class="loading-info">
      <h1>Wait<span class="wait-dots">...</span></h1>

      <p class="loading-message">
        We're getting everything ready for you
      </p>

      <div class="loading-track">
        <div class="loading-progress"></div>
      </div>

      <div class="loading-indicators">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="loading-footer">
        <span class="status-dot"></span>
        Connecting your social world
      </p>
    </section>

  </main>
</div>
